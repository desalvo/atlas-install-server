# RHEL 10 hardened development template
<VirtualHost *:443>
  ServerName atlas-install.apps.desalvo.eu
  DocumentRoot "/var/www/html"

  ServerSignature Off
  TraceEnable Off

  SSLEngine on
  SSLCertificateFile    "/etc/pki/tls/certs/atlas-install.crt"
  SSLCertificateKeyFile "/etc/pki/tls/private/atlas-install.key"
  SSLCACertificatePath  "/etc/grid-security/certificates"
  SSLVerifyClient optional
  SSLVerifyDepth 10
  SSLProtocol -all +TLSv1.2 +TLSv1.3

  Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
  Header always set X-Content-Type-Options "nosniff"
  Header always set X-Frame-Options "DENY"
  Header always set Referrer-Policy "no-referrer"

  <Directory "/var/www/html/atlas_install">
    Options -Indexes -ExecCGI
    AllowOverride None
    Require all granted
  </Directory>

  # REST API v1: route resource-oriented paths to the central JSON router.
  <Directory "/var/www/html/atlas_install/api/v1">
    Options -Indexes -ExecCGI
    AllowOverride None
    Require all granted
    FallbackResource /atlas_install/api/v1/index.php
  </Directory>

  <Directory "/var/www/html/atlas_install/conf">
    Require all denied
  </Directory>

  <FilesMatch "(^\\.|\\.(?:sql|template|save|bak|orig|ini|env|log)$)">
    Require all denied
  </FilesMatch>

  <LocationMatch "^/atlas_install/(?:protected|exec)(?:/|$)">
    Require expr "%{SSL_CLIENT_VERIFY} == 'SUCCESS'"
    SSLOptions +StdEnvVars +ExportCertData
  </LocationMatch>

  ErrorLog "/var/log/httpd/atlas-install_error_ssl.log"
  CustomLog "/var/log/httpd/atlas-install_access_ssl.log" combined
</VirtualHost>
