apiVersion: batch/v1
kind: CronJob
metadata:
  name: atlas-install-plots
  namespace: atlas-install
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: plots
              image: desalvo/atlas-install-server:3.0.0
              imagePullPolicy: IfNotPresent
              command: ["/usr/local/sbin/atlas-container-entrypoint", "maintenance", "plots"]
              env:
                - name: ATLAS_ENV_FILE
                  value: /var/lib/atlas-install/config/atlas-install.env
              volumeMounts:
                - name: data
                  mountPath: /var/lib/atlas-install
                - name: cache
                  mountPath: /var/cache/atlas-install
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: atlas-install-data
            - name: cache
              emptyDir: {}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: atlas-install-log-cleanup
  namespace: atlas-install
spec:
  schedule: "15 0 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: cleanup
              image: desalvo/atlas-install-server:3.0.0
              imagePullPolicy: IfNotPresent
              command: ["/usr/local/sbin/atlas-container-entrypoint", "maintenance", "cleanup"]
              env:
                - name: ATLAS_ENV_FILE
                  value: /var/lib/atlas-install/config/atlas-install.env
              volumeMounts:
                - name: data
                  mountPath: /var/lib/atlas-install
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: atlas-install-data
