apiVersion: v1
kind: Secret
metadata:
  name: atlas-install-bootstrap
  namespace: atlas-install
type: Opaque
stringData:
  atlas-install.env: |
    ATLAS_PUBLIC_HOSTNAME="atlas-install-el10.apps.desalvo.eu"
    ATLAS_DB_NAME="atlas_install_panda"
    ATLAS_DB_BOOTSTRAP_USER="root"
    # Optional one-time credential. The wizard removes it after a successful rollout.
        ATLAS_DB_RW_HOST="192.168.1.145"
    ATLAS_DB_RW_USER="atlas_rw"
    ATLAS_DB_RW_PASSWORD="CHANGE_ME"
    ATLAS_DB_RO_HOST="192.168.1.145"
    ATLAS_DB_RO_USER="atlas_ro"
    ATLAS_DB_RO_PASSWORD="CHANGE_ME"
    ATLAS_DB_BROKER_HOST="192.168.1.145"
    ATLAS_DB_BROKER_USER="atlas_rw"
    ATLAS_DB_BROKER_PASSWORD="CHANGE_ME"
    ATLAS_DB_SSL="0"
    ATLAS_DB_SSL_VERIFY="0"
    ATLAS_DB_SSL_CA=""
    ATLAS_DB_AUTO_INIT="1"
    ATLAS_DB_SLOW_QUERY_MS="2000"
    ATLAS_REQUEST_TIMEOUT_SECONDS="120"
    ATLAS_VO="ATLAS"
    ATLAS_EMAIL="no-reply@localhost"
    ATLAS_CONTACTS=""
    ATLAS_DEFAULT_INFOSYS="lcg-bdii.cern.ch"
    ATLAS_ACTIVITY_PERIOD="3 DAY"
    ATLAS_LOCAL_ADMIN_PASSWORD="password"
    ATLAS_SESSION_HOURS="8"
    ATLAS_DEBUG="0"
    ATLAS_UPLOAD_PATH="/var/lib/atlas-install/log"
    ATLAS_ARCHIVE_PATH="/var/lib/atlas-install/logbackup"
    ATLAS_CACHE_PATH="/var/cache/atlas-install"
    ATLAS_KML_CACHE="/var/cache/atlas-install/install.kml"
