name: GitHub release package

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Static checks before packaging
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli
          ./tests/ci-static.sh

      - name: Build source release archive
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="atlas-install-server-${version}"
          mkdir -p dist "$name"
          rsync -a --delete \
            --exclude '.git' \
            --exclude 'dist' \
            --exclude '.env' \
            --exclude 'secrets/*' \
            --exclude "$name" \
            ./ "$name"/
          tar -czf "dist/${name}.tar.gz" "$name"
          sha256sum "dist/${name}.tar.gz" > "dist/${name}.tar.gz.sha256"
          rm -rf "$name"

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
